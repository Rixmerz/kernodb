[package]
name = "spike-bench"
description = "Benchmark driver for the Kerno Phase 0 storage spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
spike-core.workspace = true
hdrhistogram = "7.5"
redb = "4"
fjall = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
parking_lot.workspace = true
serde_json = "1"
spike-btree = { workspace = true, optional = true }
spike-lsm = { workspace = true, optional = true }
kerno-storage = { workspace = true, optional = true }

[dev-dependencies]
# `Emulated<E>` for the differential test with range deletions.
kerno-testkit.workspace = true

[features]
default = []
# The two Phase 0 candidates (enabled once their crates are implemented).
candidates = ["dep:spike-btree", "dep:spike-lsm"]
# The Phase 1 product engine (`kerno-storage`).
kerno = ["dep:kerno-storage"]
