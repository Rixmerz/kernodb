[package]
name = "kerno-python"
description = "Python bindings for Kerno, built with PyO3 and maturin"
version = "1.0.0-alpha.4"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rixmerz/kernodb"
publish = false

[lib]
name = "_kerno"
crate-type = ["cdylib"]

[dependencies]
kerno = { package = "kernodb", path = "../../crates/kerno", version = "1.0.0-alpha.4" }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
# The write path allocates several small buffers per record; mimalloc measured 18-26% faster
# than the system allocator on bulk ingest. It serves only the allocations of this extension.
mimalloc = { version = "0.1", default-features = false }

# The wheel is the product: whole-program inlining across the storage, units and binding crates
# is worth the longer build.
[profile.release]
lto = "fat"
codegen-units = 1
