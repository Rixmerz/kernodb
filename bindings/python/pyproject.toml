[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "kernodb"
description = "Kerno: an embedded database of units, revisions and relations, for AI memory"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
keywords = ["database", "embedded", "memory", "ai", "storage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Rixmerz/kernodb"

[tool.maturin]
python-source = "python"
module-name = "kerno._kerno"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
