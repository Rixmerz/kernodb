[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kerno-client"
version = "1.0.0a1"
description = "A pure-Python HTTP client for kerno-server, the Kerno database server"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
keywords = ["database", "memory", "ai", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Typing :: Typed",
]
# No runtime dependencies: the client uses only the standard library.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Rixmerz/kernodb"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kerno_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
