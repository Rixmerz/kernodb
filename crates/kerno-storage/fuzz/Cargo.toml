[package]
name = "kerno-storage-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace root: the fuzz crate is outside the Kerno workspace, so
# the workspace's build, MSRV and CI never see it (nightly only, see README).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
kerno-core = { path = "../../kerno-core" }
kerno-storage = { path = ".." }
kerno-testkit = { path = "../../kerno-testkit" }

[profile.release]
debug = 1


[[bin]]
name = "varint"
path = "fuzz_targets/varint.rs"
test = false
doc = false
bench = false

