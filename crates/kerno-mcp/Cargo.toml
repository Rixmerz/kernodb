[package]
name = "kerno-mcp"
description = "MCP server that lets an AI agent use a Kerno database as long-term memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kerno-core.workspace = true
kerno-storage.workspace = true
kerno-units.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A request must never panic the server: an error reaches the client instead.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
