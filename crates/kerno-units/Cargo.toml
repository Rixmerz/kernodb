[[test]]
name = "derived_vectors"
required-features = ["test-support"]

# These two rebuild a database as a build before layer 5 left it
# (`harness::units::to_legacy`), which needs `raw_commit`.
[[test]]
name = "layer_fixtures"
required-features = ["test-support"]

[[test]]
name = "public_ids"
required-features = ["test-support"]

[[test]]
name = "history"
required-features = ["test-support"]

[[test]]
name = "index"
required-features = ["test-support"]

[[test]]
