[package]
name = "kerno-units"
description = "Kerno units layer: typed units, revisions, relations, indexes and derived data over the storage engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Published because `kerno` depends on it; the alpha notice is in its own README.
publish = true
readme = "README.md"
keywords = ["database", "embedded", "revisions", "memory", "kerno"]
categories = ["database-implementations"]

[dependencies]
kerno-core.workspace = true
crc32c.workspace = true
blake3.workspace = true
# Only for the `embed-openai` feature: a remote or local OpenAI-compatible
# embedding endpoint. Never reached by kerno-core or by a default build. TLS is
# the platform's (`native-tls`), not rustls: rustls pulls ring, rustls-webpki
# and webpki-roots, whose licences deny.toml does not allow.
ureq = { version = "3", optional = true, default-features = false, features = ["json", "native-tls-no-default"] }
serde_json = { version = "1", optional = true }

# Windows has no /dev/urandom: public ids read the OS generator through it.
[target.'cfg(windows)'.dependencies]
getrandom = "0.3"

[features]
# The raw write accessor (`UnitDb::raw_commit`) and the engine test hooks
# (`hook_flush`, `hook_wait_idle`, `hook_compact_range`) of `UnitDb` (D23 of
# stage9-record.md). Off by default: a production build has no write path below
# the layer and no compaction of an arbitrary range; its public reclamation
# calls are `reclaim` (the whole key space) and `compact` (the revision ranges
# REV_META and REV_PAYLOAD), both through kerno-core's `Reclaim` trait. The
# targets below that call them build only with it; plain `cargo test` skips
# them, `cargo test --features test-support` (or `--all-features`) runs them.
test-support = []
# `embed::OpenAiCompatible` (a client of `POST {base_url}/embeddings`, for a
# remote API or a local model). Off by default: the default build has no HTTP
# client, no TLS and no JSON parser. The key comes from the environment.
embed-openai = ["dep:ureq", "dep:serde_json"]

[dev-dependencies]
proptest.workspace = true
kerno-testkit.workspace = true
# Only for tests: the design runs the layer's suites over `KernoDb` as well as
# `Emulated<LogEngine>` (stage3-design.md §8, E3-03). The layer itself never
# depends on it.
kerno-storage.workspace = true

[[test]]
name = "assoc_indexed"
required-features = ["test-support"]

[[test]]
name = "assoc_reference"
required-features = ["test-support"]

[[test]]
name = "cache"
required-features = ["test-support"]

[[test]]
