[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kerno-langchain"
version = "1.0.0a1"
description = "LangChain vector store and chat message history on a Kerno database server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
keywords = ["database", "memory", "ai", "langchain", "vector-store"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Typing :: Typed",
]
# kerno-client is not on PyPI yet: install it from clients/python first (see the README).
dependencies = ["kerno-client", "langchain-core>=1.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Rixmerz/kernodb"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kerno_langchain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The source tree of this package and of the client, so the tests run from a checkout.
pythonpath = ["src", "../../clients/python/src"]
