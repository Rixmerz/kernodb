# cargo-deny policy (threat T-10). Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Vulnerabilities always fail. Unmaintained crates fail when reachable
# through any workspace member's dependencies.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Only licences the current tree uses; all are compatible with MIT OR Apache-2.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# The TLS stack of kerno-server (rustls with the ring provider) needs these, and only these
# crates get them: the allow list above stays as it was.
exceptions = [
    { crate = "ring", allow = ["ISC"] },
    { crate = "rustls-webpki", allow = ["ISC"] },
    { crate = "untrusted", allow = ["ISC"] },
    { crate = "subtle", allow = ["BSD-3-Clause"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
