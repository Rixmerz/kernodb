name: Python wheels

# Builds the `kernodb` Python package (bindings/python) as abi3-py39 wheels for
# every target below plus an sdist, and tests each wheel on its own runner. A
# `v*` tag also offers the files to PyPI, through trusted publishing, once the
# owner approves the `pypi` environment. Steps: docs/release.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  wheel:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Windows stays best effort until the owner keeps it in the 1.0 set
    # (decision 6, row ENG-03), as in release.yml.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, experimental: true }
          # musl (Alpine, slim containers): built in the musllinux container, tested in Alpine.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          # Linux wheels are built in the manylinux container; ignored elsewhere.
          manylinux: ${{ matrix.musl && 'musllinux_1_2' || 'auto' }}
          args: --release --locked --out dist
      - name: Install the wheel and run the tests (Alpine)
        if: matrix.musl
        run: |
          docker run --rm -v "$PWD:/w" -w /w/bindings/python python:3.12-alpine sh -euc '
            pip install pytest
            pip install --no-index --find-links dist kernodb
            python -m pytest tests'
      - name: Install the wheel and run the tests
        if: ${{ !matrix.musl }}
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pip install --no-index --find-links bindings/python/dist kernodb
          python -m pytest bindings/python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [wheel, sdist]
    # Only a tag publishes; workflow_dispatch only builds and tests.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The environment requires the owner's approval before this job starts.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
