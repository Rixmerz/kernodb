name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly long run with many more seeds for the randomized suites.
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: kerno-core has no dependencies
        run: test "$(cargo tree -p kerno-core -e normal --prefix none | wc -l)" -eq 1
      # Both guards fail closed: an error of cargo tree or grep (renamed
      # crate, missing directory) fails the step instead of passing it.
      - name: kerno-storage does not depend on spikes or test crates at run time
        shell: bash
        run: |
          tree=$(cargo tree -p kerno-storage -e normal --prefix none) && grep -q '^kerno-storage ' <<<"$tree" && ! grep -E '^(spike-|kerno-testkit|proptest|loom)' <<<"$tree"
      - name: kerno-storage never uses std::fs (all file access goes through Vfs)
        shell: bash
        run: |
          if grep -rn 'std::fs' crates/kerno-storage/src; then false; else test $? -eq 1; fi

  # The tests run as two parallel jobs (phase1-design.md §6.7): everything
  # but the engine (spikes, kerno-core, kerno-testkit and its reference
  # engine, the differential test, and kerno-units with its crash sweeps and
  # kill -9 test), and the engine with all its profiles.
  test-spikes:
    name: spikes, testkit, reference engine and differential test
    runs-on: ubuntu-latest
    env:
      # Empty means "each suite's default"; the weekly run uses 1000 seeds.
      SPIKE_SEEDS: ${{ github.event_name == 'schedule' && '1000' || '' }}
      # Iterations of the kill -9 test of kerno-units
      # (crates/kerno-units/tests/process_kill.rs); empty means 20.
      KERNO_KILL_ITERS: ${{ github.event_name == 'schedule' && '200' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude kerno-storage --all-features --release -- --nocapture 2>&1 | tee test.log
        shell: bash
      - name: Corruption outcomes
        if: always()
        run: grep -h "Outcomes" test.log >> "$GITHUB_STEP_SUMMARY" || true

  test-kerno:
    name: kerno-storage suites (all profiles), regressions and model test
    runs-on: ubuntu-latest
    env:
      # Empty means "each suite's default"; the weekly run uses 1000 seeds.
      SPIKE_SEEDS: ${{ github.event_name == 'schedule' && '1000' || '' }}
      # Iterations of the kill -9 tests (tests/process_kill.rs); empty means 20.
      KERNO_KILL_ITERS: ${{ github.event_name == 'schedule' && '200' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kerno-storage --all-features --release -- --nocapture 2>&1 | tee test.log
        shell: bash
      - name: Corruption outcomes
        if: always()
        run: grep -h "Outcomes" test.log >> "$GITHUB_STEP_SUMMARY" || true

  # The loom models explore every interleaving of the commit queue's protocol
  # (phase1-design.md §5.6, §6.7); slow, so weekly (and on demand) only.
  loom:
    name: loom models of the commit queue
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg kerno_loom
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kerno-storage --release --lib commit_queue

  bench-smoke:
    name: benchmark smoke run (tiny scale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p spike-bench --features candidates,kerno
      - run: |
          target/release/spike-bench suite --engines btree,lsm,kerno,redb,fjall,sqlite --workloads all \
            --scales tiny --reps 1 --dir bench-data --out smoke.jsonl
          target/release/spike-bench report --input smoke.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
          ! grep -q '"error"' smoke.jsonl
        shell: bash
