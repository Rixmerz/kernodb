[workspace]
resolver = "3"
members = [
    "spikes/storage/spike-core",
    "spikes/storage/spike-btree",
    "spikes/storage/spike-lsm",
    "spikes/storage/spike-bench",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rixmerz/kernodb"

[workspace.dependencies]
spike-core = { path = "spikes/storage/spike-core" }
spike-btree = { path = "spikes/storage/spike-btree" }
spike-lsm = { path = "spikes/storage/spike-lsm" }
crc32c = "0.6"
parking_lot = "0.12"
quick_cache = "0.6"
crossbeam-skiplist = "0.1"

[profile.release]
debug = 1

[profile.test]
opt-level = 1
